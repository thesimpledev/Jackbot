name: Deploy

on:
  push:
    tags:
      - 'prod-*'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build arm64 binary
        run: GOOS=linux GOARCH=arm64 go build -mod=vendor -o jackbot .

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Upload binary to deploy bucket
        run: |
          aws s3api put-object \
            --bucket "${{ vars.DEPLOY_BUCKET }}" \
            --key jackbot/bin/jackbot \
            --body jackbot \
            --tagging 'kind=bin&project=jackbot'

      - name: Deploy on server via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.DEPLOY_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "jackbot deploy ${{ github.ref_name }}" \
            --parameters 'commands=[
              "set -e",
              "aws s3api get-object --bucket ${{ vars.DEPLOY_BUCKET }} --key jackbot/bin/jackbot /tmp/jackbot.new",
              "install -o root -g root -m 0755 /tmp/jackbot.new /opt/jackbot/bin/jackbot",
              "rm /tmp/jackbot.new",
              "systemctl restart jackbot@*"
            ]' \
            --query 'Command.CommandId' --output text)
          echo "command_id=$COMMAND_ID"
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.DEPLOY_INSTANCE_ID }}" || WAIT_FAILED=1
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.DEPLOY_INSTANCE_ID }}" \
            --query '{Status: Status, Stdout: StandardOutputContent, Stderr: StandardErrorContent}' \
            --output json
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.DEPLOY_INSTANCE_ID }}" \
            --query 'Status' --output text)
          if [ "$STATUS" != "Success" ]; then
            echo "SSM deploy finished with status $STATUS"
            exit 1
          fi
